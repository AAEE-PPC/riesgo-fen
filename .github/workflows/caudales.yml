name: Caudales diarios (SENAMHI)
on:
  schedule:
    - cron: "0 12 * * *"     # 07:00 Lima (UTC-5)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python scripts/caudales.py
      - name: Guardar el JSON
        run: |
          git config user.name "caudales-bot"
          git config user.email "caudales-bot@users.noreply.github.com"
          git add fen/caudales_hoy.json
          git diff --cached --quiet || git commit -m "caudales_hoy $(date -u +%F)"
          git push
