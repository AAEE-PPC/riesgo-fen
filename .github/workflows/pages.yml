name: Publicar dashboard (GitHub Pages)

# Publica la carpeta "fen" en GitHub Pages cada vez que cambia algo en ella
# (el index.html o el caudales_hoy.json que sube cada mañana el script de la PC).
on:
  push:
    branches: [main]
    paths:
      - "fen/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: fen
      - id: deploy
        uses: actions/deploy-pages@v4
